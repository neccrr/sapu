[workspace]
resolver = "2"
members = ["crates/sapu-core", "crates/sapu-cli", "crates/sapu-gui"]
# `cargo run` with no -p opens the window app
default-members = ["crates/sapu-gui"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
authors = ["neccrr"]
repository = "https://github.com/neccrr/sapu"
homepage = "https://github.com/neccrr/sapu"
rust-version = "1.95"

[workspace.dependencies]
sapu-core = { path = "crates/sapu-core" }
# core
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
trash = "5"
dirs = "6"
tracing = "0.1"
# cli
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humansize = "2"
ratatui = "0.30"
indicatif = "0.18"
console = "0.16"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# gui
eframe = "0.37"
rfd = "0.18"

[profile.release]
lto = true
codegen-units = 1
